<div class="calendar-layout">

   <mat-calendar
  #calendar
  
  [dateClass]="dateClass">
</mat-calendar>

  <div class="legend">
    <h4>Leave Indicators</h4>

    <div class="legend-item">
      <span class="dot approved"></span>
      Approved Leave
    </div>

    <div class="legend-item">
      <span class="dot rejected"></span>
      Rejected Leave
    </div>

    <div class="legend-item">
      <span class="dot available"></span>
      Available Day
    </div>
  </div>

</div>
